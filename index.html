<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Regina Caffè a Grottaglie: aperitivi, cocktail, birre, gin, serate ed eventi nel cuore della piazza. Ogni sera dalle 20."
    />

    <meta
      name="theme-color"
      content="#F3ECDE"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!--
      canonical, og:url e i link hreflang per
      /, /en e /fr sono generati a runtime da
      src/i18n/useDocumentMeta.js.

      Gli URL assoluti (og:image, twitter:image,
      i campi url/image/logo dei dati strutturati,
      sitemap.xml e la riga Sitemap: di robots.txt)
      li scrive in build vite-seo-plugin.js,
      leggendo la variabile VITE_SITE_URL: è lui
      a sostituire il segnaposto SITE_URL (tra
      due simboli di percentuale) usato qui sotto.
    -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Regina Caffè Grottaglie | Aperitivi, cocktail e serate"
    />

    <meta
      name="twitter:description"
      content="Dal primo aperitivo all’ultimo cocktail, nel cuore di Grottaglie."
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/logo.svg"
    />

    <!--
      Font serviti dal nostro dominio.
      Nessuna connessione a Google Fonts:
      le regole @font-face stanno in
      src/fonts.css, i file in public/fonts.

      Precarichiamo solo i due tagli latini
      usati subito dall'hero, gli altri
      vengono richiesti su necessita'.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/instrument-serif-400-normal-latin.woff2"
      crossorigin
    />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/work-sans-400-normal-latin.woff2"
      crossorigin
    />

    <!-- Social preview -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="it_IT"
    />

    <meta
      property="og:locale:alternate"
      content="en_GB"
    />

    <meta
      property="og:locale:alternate"
      content="fr_FR"
    />

    <meta
      property="og:site_name"
      content="Regina Caffè"
    />

    <meta
      property="og:title"
      content="Regina Caffè Grottaglie | Aperitivi, cocktail e serate"
    />

    <meta
      property="og:description"
      content="Dal primo aperitivo all’ultimo cocktail, nel cuore di Grottaglie."
    />

    <title>
      Regina Caffè Grottaglie | Aperitivi, cocktail e serate
    </title>

    <!--
      Dati strutturati del locale.
      Orari, telefono e indirizzo devono
      restare allineati a src/data/openingHours.js
      e a src/components/social/SocialSection.jsx.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BarOrPub",
        "name": "Regina Caffè",
        "description": "Aperitivi, cocktail, birre, gin ed eventi nel cuore di Grottaglie, ogni sera dalle 20.",
        "url": "%SITE_URL%/",
        "image": "%SITE_URL%/og-image.jpg",
        "logo": "%SITE_URL%/logo.svg",
        "telephone": "+39 345 683 6439",
        "email": "reginacaffegrottaglie@gmail.com",
        "vatID": "03479700738",
        "priceRange": "€€",
        "servesCuisine": ["Aperitivi", "Cocktail", "Birre"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Piazza Regina Margherita, 21",
          "addressLocality": "Grottaglie",
          "addressRegion": "TA",
          "postalCode": "74023",
          "addressCountry": "IT"
        },
        "sameAs": [
          "https://www.instagram.com/reginacaffe_grottaglie/",
          "https://www.facebook.com/reginacaffegrottaglie/",
          "https://www.tiktok.com/@reginacaff_grotta"
        ],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "20:00",
            "closes": "04:00"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
